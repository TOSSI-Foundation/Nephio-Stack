# This rule is not used by the project sdcore-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the sdcore.nephio.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sdcore-operator
    app.kubernetes.io/managed-by: kustomize
  name: sdcoredeployment-editor-role
rules:
- apiGroups:
  - sdcore.nephio.io
  resources:
  - sdcoredeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sdcore.nephio.io
  resources:
  - sdcoredeployments/status
  verbs:
  - get
