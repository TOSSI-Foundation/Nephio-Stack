# This rule is not used by the project sdcore-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over sdcore.nephio.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sdcore-operator
    app.kubernetes.io/managed-by: kustomize
  name: sdcoredeployment-admin-role
rules:
- apiGroups:
  - sdcore.nephio.io
  resources:
  - sdcoredeployments
  verbs:
  - '*'
- apiGroups:
  - sdcore.nephio.io
  resources:
  - sdcoredeployments/status
  verbs:
  - get
