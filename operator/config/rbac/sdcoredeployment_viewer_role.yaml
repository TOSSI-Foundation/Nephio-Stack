# This rule is not used by the project sdcore-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to sdcore.nephio.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sdcore-operator
    app.kubernetes.io/managed-by: kustomize
  name: sdcoredeployment-viewer-role
rules:
- apiGroups:
  - sdcore.nephio.io
  resources:
  - sdcoredeployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sdcore.nephio.io
  resources:
  - sdcoredeployments/status
  verbs:
  - get
