---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: networkslices.sdcore.nephio.io
spec:
  group: sdcore.nephio.io
  names:
    kind: NetworkSlice
    listKind: NetworkSliceList
    plural: networkslices
    shortNames:
    - slice
    singular: networkslice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sst
      name: SST
      type: string
    - jsonPath: .spec.sd
      name: SD
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NetworkSlice is the Schema for the networkslices API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetworkSliceSpec declares one 5G slice. The NetworkSliceReconciler reconciles it into the webconsole
              as a device-group (its subscribers' IMSIs + UE IP pool) + a network-slice (sst/sd + site-info with
              the PLMN, gNB(s)+TAC, and UPF). The site-info is what makes the AMF advertise the served TAI, which
              is why a gNB's NG Setup succeeds. Pure-Nephio replacement for the sdcore-provisioner bash slice path.
            properties:
              dnn:
                default: internet
                type: string
              gnbs:
                items:
                  description: GnbRef names a gNB + its TAC for the slice site-info
                    (the AMF advertises the served TAI from this).
                  properties:
                    name:
                      type: string
                    tac:
                      default: 1
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              plmn:
                description: PlmnId is a mcc/mnc pair.
                properties:
                  mcc:
                    default: "001"
                    type: string
                  mnc:
                    default: "01"
                    type: string
                type: object
              qos:
                description: SliceQos caps the data flow (MBR). Defaults to 1 Gbps
                  up/down.
                properties:
                  mbrDownlink:
                    format: int64
                    type: integer
                  mbrUplink:
                    format: int64
                    type: integer
                type: object
              sd:
                type: string
              sst:
                default: "1"
                type: string
              uePool:
                type: string
              upfName:
                default: upf
                type: string
            required:
            - gnbs
            - sd
            - uePool
            type: object
          status:
            description: NetworkSliceStatus is the observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                type: string
              phase:
                type: string
              provisioned:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
