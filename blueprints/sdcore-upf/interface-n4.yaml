# N4 (SMF<->UPF, PFCP). On the SHARED vpc-internal fabric so the central SMF can reach every
# edge UPF across clusters — THIS is what makes the distributed datapath auto-wire (the thing
# that was broken until specialization put the UPF on the shared fabric).
apiVersion: req.nephio.org/v1alpha1
kind: Interface
metadata:
  name: n4
  annotations:
    nephio.org/network-name: n4
    config.kubernetes.io/local-config: "true"
spec:
  networkInstance:
    name: vpc-internal
  cniType: macvlan
  attachmentType: vlan
