# N3 (gNB<->UPF, GTP-U). A REQUEST for an IP on the RAN fabric; IPAM fills spec+status per site.
apiVersion: req.nephio.org/v1alpha1
kind: Interface
metadata:
  name: n3
  annotations:
    nephio.org/network-name: n3
    config.kubernetes.io/local-config: "true"
spec:
  networkInstance:
    name: vpc-ran
  cniType: macvlan
  attachmentType: vlan
