# Specialize the edge-site package from the injected EdgeSite.spec (edgesite-injection.yaml).
apiVersion: fn.kpt.dev/v1alpha1
kind: ApplyReplacements
metadata:
  name: edge-site-params
  annotations:
    config.kubernetes.io/local-config: "true"
replacements:
  # UPF N3/N6 addresses + gateways + UE pool
  - source: {kind: EdgeSite, fieldPath: spec.accessCIDR}
    targets:
      - select: {kind: NFDeployment}
        fieldPaths: [spec.interfaces.0.ipv4.address]
  - source: {kind: EdgeSite, fieldPath: spec.accessGw}
    targets:
      - select: {kind: NFDeployment}
        fieldPaths: [spec.interfaces.0.ipv4.gateway]
      - select: {kind: UPFDataPath}
        fieldPaths: [spec.accessGateway]
  - source: {kind: EdgeSite, fieldPath: spec.coreCIDR}
    targets:
      - select: {kind: NFDeployment}
        fieldPaths: [spec.interfaces.1.ipv4.address]
  - source: {kind: EdgeSite, fieldPath: spec.coreGw}
    targets:
      - select: {kind: NFDeployment}
        fieldPaths: [spec.interfaces.1.ipv4.gateway]
  - source: {kind: EdgeSite, fieldPath: spec.uePool}
    targets:
      - select: {kind: NFDeployment}
        fieldPaths: [spec.networkInstances.0.dataNetworks.0.pool.0.prefix]
      - select: {kind: UPFDataPath}
        fieldPaths: [spec.uePool]
  # UPFDataPath (datapath actuator reconciles from this)
  - source: {kind: EdgeSite, fieldPath: spec.coreGw}
    targets:
      - select: {kind: UPFDataPath}
        fieldPaths: [spec.coreGateway]
  - source: {kind: EdgeSite, fieldPath: spec.coreNextHop}
    targets:
      - select: {kind: UPFDataPath}
        fieldPaths: [spec.coreNextHop]
  - source: {kind: EdgeSite, fieldPath: spec.gnbIP}
    targets:
      - select: {kind: UPFDataPath}
        fieldPaths: [spec.gnbIP]
  - source: {kind: EdgeSite, fieldPath: spec.egressNic}
    targets:
      - select: {kind: UPFDataPath}
        fieldPaths: [spec.egressNic]
