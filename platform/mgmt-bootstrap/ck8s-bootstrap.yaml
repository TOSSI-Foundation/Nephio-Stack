# Canonical Kubernetes bootstrap config for the management node.
# containerd-base-dir: put CK8s's containerd on its own path so it coexists with any
# pre-existing containerd (e.g. Docker) on a shared host. On a dedicated mgmt box this
# isn't needed, but it makes the bootstrap host-agnostic.
cluster-config:
  network:
    enabled: true
  dns:
    enabled: true
# Pin the kubelet node IP to the LAN address (mgmt-up substitutes __NODE_IP__ from MGMT_LAN_IP). Without
# this, CK8s can pick a stray global IP (e.g. an OCUDU RAN loopback lo:ODU) as the node InternalIP.
extra-node-kubelet-args:
  --node-ip: __NODE_IP__
  # local-built images have no registry to re-pull from; never let kubelet GC them
  --image-gc-high-threshold: "100"
containerd-base-dir: /var/lib/ck8s-containerd
